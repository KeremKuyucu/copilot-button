name: Build & Release AHK Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AHK v2 and Ahk2Exe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "./tools"
          
          # AHK v2 İndir
          Write-Host "AutoHotkey v2 indiriliyor..."
          Invoke-WebRequest -Uri "https://www.autohotkey.com/download/ahk-v2.zip" -OutFile "./tools/ahk2.zip"
          Expand-Archive -Path "./tools/ahk2.zip" -DestinationPath "./tools/AHK2" -Force

          # Ahk2Exe İndir (GitHub Releases)
          Write-Host "Ahk2Exe indiriliyor..."
          $ahk2exeRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $zipAsset = $ahk2exeRelease.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          Invoke-WebRequest -Uri $zipAsset.browser_download_url -OutFile "./tools/ahk2exe.zip"
          Expand-Archive -Path "./tools/ahk2exe.zip" -DestinationPath "./tools/Ahk2Exe" -Force

      - name: Compile AHK to EXE
        shell: powershell
        run: |
          Write-Host "CopilotButton.exe derleniyor..."
          ./tools/Ahk2Exe/Ahk2Exe.exe /in "copilot-buton.ahk" /out "CopilotButton.exe" /icon "logo.ico" /base "./tools/AHK2/AutoHotkey64.exe"
          Write-Host "Derleme tamamlandı!"

      - name: Upload Artifact (Her Derlemede)
        uses: actions/upload-artifact@v4
        with:
          name: CopilotButton-Exe
          path: CopilotButton.exe

      - name: Create Release and Upload EXE (Etiket Atıldığında)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CopilotButton.exe
            logo.ico
            logo_muted.ico
            config.ini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
