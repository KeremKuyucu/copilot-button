# ============================================================
# Copilot Button – GitHub Actions Release Pipeline
# ============================================================
# Triggers:
#   - Push of a version tag (v2.x.x)
#   - Manual dispatch (workflow_dispatch)
#
# Process:
#   1. Resolve release version (from tag, app.rc, or input)
#   2. Generate release notes with Gemini API if missing
#   3. Setup MinGW C++20 toolchain (GCC + windres)
#   4. Compile native engine into standalone CopilotButton.exe
#   5. Code sign CopilotButton.exe (SignTool + RFC 3161 timestamping)
#   6. Package distribution files (CopilotButton.exe + portable zip)
#   7. Generate SHA-256 checksums
#   8. Upload artifacts & publish GitHub Release
# ============================================================

name: Copilot Button Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0, optional if tagged)'
        required: false
        default: ''
      create_github_release:
        description: 'Create/update GitHub Release?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Release (Windows)
    runs-on: windows-latest

    steps:
      # ── Checkout repository ───────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Determine Version ─────────────────────────────────
      - name: Determine Version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          if (-not $v) {
            $rc = "engine\app.rc"
            if (Test-Path $rc) {
              $content = Get-Content $rc -Raw
              if ($content -match 'VALUE\s+"ProductVersion",\s*"([^"\\\r\n]+)') {
                $v = $matches[1].Trim()
              }
            }
          }
          if (-not $v) { $v = "2.0.0" }
          Write-Host "Resolved Version: $v"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # ── Set up Python ─────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Generate release notes via Gemini API if missing ───
      - name: Generate release notes (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $notesFile = ".github\releases\RELEASE_$v.md"

          if (Test-Path $notesFile) {
            Write-Host "Release notes already present: $notesFile"
          } elseif ($env:GEMINI_API_KEY) {
            Write-Host "Generating release notes via Gemini API for v$v..."
            python .github/scripts/generate_release_notes.py --engine gemini --version $v
          } else {
            Write-Warning "GEMINI_API_KEY not configured and release notes not present."
          }

      # ── Setup MinGW Toolchain ─────────────────────────────
      - name: Setup MinGW Toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command g++ -ErrorAction SilentlyContinue) -or -not (Get-Command windres -ErrorAction SilentlyContinue)) {
            Write-Host "Installing MinGW via Chocolatey..."
            choco install mingw --no-progress -y
          }
          g++ --version
          windres --version

      # ── Compile Native C++20 Standalone Engine ────────────
      - name: Compile CopilotButton.exe
        shell: cmd
        working-directory: engine
        run: |
          call build_mingw.bat

      # ── Verify Built Binary ───────────────────────────────
      - name: Verify Binary
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\CopilotButton.exe"
          if (-not (Test-Path $exe)) {
            throw "Compilation failed: CopilotButton.exe not found at $exe"
          }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "CopilotButton.exe built successfully ($sizeMB MB)"

      # ── Locate SignTool ───────────────────────────────────
      - name: Locate SignTool
        id: signtool
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe",
            "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $found) {
            $found = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch 'arm' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ($found) {
            Write-Host "SignTool found: $found"
            echo "path=$found" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "signtool.exe not found on runner."
          }

      # ── Sign Application Binary ───────────────────────────
      - name: Sign CopilotButton.exe
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $clean = ($env:WINDOWS_PFX_BASE64 -replace '\s+', '')
          $pfxBytes = [Convert]::FromBase64String($clean)
          $pfxPath = "${{ github.workspace }}\signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $pfxPassword = if ($env:WINDOWS_PFX_PASSWORD) { $env:WINDOWS_PFX_PASSWORD.Trim() } else { "" }
          $signtool = "${{ steps.signtool.outputs.path }}"
          $file = "${{ github.workspace }}\CopilotButton.exe"

          if (-not $signtool) {
            throw "signtool.exe path is empty"
          }

          # Import certificate to Root store for verification
          try {
            $secPass = ConvertTo-SecureString $pfxPassword -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\LocalMachine\Root -Password $secPass | Out-Null
            Write-Host "Certificate added to LocalMachine\Root for verification."
          } catch {
            Write-Warning "Could not import certificate to Root store: $_"
          }

          $timestampServers = @(
            "http://timestamp.sectigo.com",
            "http://timestamp.digicert.com",
            "http://tsa.starfieldtech.com",
            "http://timestamp.globalsign.com/tsa/r6advanced1"
          )

          Write-Host "Signing CopilotButton.exe..."
          $signed = $false
          foreach ($ts in $timestampServers) {
            Write-Host "  Trying timestamp server: $ts"
            & $signtool sign /fd SHA256 /tr $ts /td SHA256 /f $pfxPath /p $pfxPassword $file 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  Successfully signed with $ts"
              $signed = $true
              break
            }
          }

          Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue

          if (-not $signed) {
            throw "Failed to sign CopilotButton.exe on all timestamp servers."
          }

          & $signtool verify /pa /v $file 2>&1
          Write-Host "Signature verified."

      # ── Package Distribution Files ────────────────────────
      - name: Package Distribution Files
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $distDir = "${{ github.workspace }}\dist"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null

          $exe = "${{ github.workspace }}\CopilotButton.exe"
          Copy-Item $exe -Destination "$distDir\CopilotButton.exe"

          # Portable zip archive (CopilotButton.exe + config.ini)
          $zipName = "CopilotButton-v$v-portable.zip"
          $zipPath = "$distDir\$zipName"
          Compress-Archive -Path "$exe", "config.ini" -DestinationPath $zipPath
          Write-Host "Created portable archive: $zipName"

          # Generate SHA-256 checksums
          $items = @(
            "$distDir\CopilotButton.exe",
            $zipPath
          )
          foreach ($item in $items) {
            $hash = (Get-FileHash -Path $item -Algorithm SHA256).Hash.ToLower()
            $fileName = Split-Path $item -Leaf
            "$hash  $fileName" | Set-Content -Path "$item.sha256" -Encoding ascii
            Write-Host "SHA256 ($fileName): $hash"
          }

      # ── Upload Artifacts ──────────────────────────────────
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copilot-button-v${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 30

      # ── Create GitHub Release ─────────────────────────────
      - name: Create GitHub Release
        if: >
          github.event_name == 'push' ||
          github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Copilot Button v${{ steps.ver.outputs.version }}
          body_path: ${{ hashFiles(format('.github/releases/RELEASE_{0}.md', steps.ver.outputs.version)) != '' && format('.github/releases/RELEASE_{0}.md', steps.ver.outputs.version) || '' }}
          files: |
            dist/CopilotButton.exe
            dist/CopilotButton.exe.sha256
            dist/CopilotButton-v${{ steps.ver.outputs.version }}-portable.zip
            dist/CopilotButton-v${{ steps.ver.outputs.version }}-portable.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: ${{ hashFiles(format('.github/releases/RELEASE_{0}.md', steps.ver.outputs.version)) == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
